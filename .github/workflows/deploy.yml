name: Test & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: mbstring, pdo_pgsql, pdo_sqlite, bcmath, zip, gd, intl
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "23"
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
        run: php artisan test

  deploy:
    name: Deploy to VPS
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            if [ ! -d "/var/www/mom-popPOS/.git" ]; then
              echo "==> Fresh VPS directory detected. Cloning repository..."
              git clone https://github.com/Mikelesnr/mom-popPOS.git /var/www/mom-popPOS
              cd /var/www/mom-popPOS
            else
              cd /var/www/mom-popPOS
              echo "==> Pulling latest main branch"
              git pull origin main
            fi

            echo "==> Installing PHP dependencies"
            composer install --no-dev --optimize-autoloader --no-interaction

            echo "==> Installing and building React/Inertia assets"
            npm ci
            npm run build

            echo "==> Running database migrations"
            php artisan migrate --force

            echo "==> Refreshing application caches"
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan event:cache

            echo "==> Applying file permissions and reloading services"
            sudo /usr/local/bin/fix-app-permissions.sh

            echo "==> Deploy complete!"